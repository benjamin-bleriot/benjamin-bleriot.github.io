name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Chaque lundi à 6 h UTC : notes, versions et nouveautés App Store à jour.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser les données App Store
        run: npm run appstore

      - name: Compiler le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
